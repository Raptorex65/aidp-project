{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.secrets.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minio.rootPassword | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.minio.storage.size }}
  storageClassName: {{ default "gp2" .Values.global.storageClass }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.minio.replicas }}
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.minio.consolePort}}"
          envFrom:
            - secretRef:
                name: minio-secret
          ports:
            - name: s3
              containerPort: {{ .Values.minio.servicePort }}
            - name: console
              containerPort: {{ .Values.minio.consolePort }}
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: {{ .Values.minio.servicePort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.minio.servicePort }}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: {{ .Values.minio.servicePort }}
      targetPort: {{ .Values.minio.servicePort }}
    - name: console
      port: {{ .Values.minio.consolePort}}
      targetPort: {{ .Values.minio.consolePort}}
  type: ClusterIP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: "{{ .Values.minio.mcImage.repository }}:{{ .Values.minio.mcImage.tag }}"
          imagePullPolicy: {{ .Values.minio.mcImage.pullPolicy }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD

            - name: AWS_DEFAULT_REGION
              value: "us-east-1"

            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for MinIO..."

              until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
                sleep 2
              done

              echo "Creating bucket: mlflow (if not exists)"

              aws --endpoint-url http://minio:9000 s3api head-bucket \
                --bucket mlflow >/dev/null 2>&1 || \
              aws --endpoint-url http://minio:9000 s3 mb s3://mlflow

              echo "Bucket ready."
{{- end }}              