modelApi:
  enabled: true
  image:
    repository: ghcr.io/raptorex65/aidp-model-api
    tag: latest
    pullPolicy: Always
  replicas: 1
  servicePort: 8080
  containerPort: 8080
  mlflowTrackingUri: "http://mlflow:5000"
  modelName: "iris-classifier"
  mlflowS3EndpointUrl: "http://minio:9000"
  
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  servicePort: 5432
  storage:
    size: 2Gi

minio:
  enabled: true
  image:
    repository: ghcr.io/coollabsio/minio
    tag: RELEASE.2025-10-15T17-29-55Z
    pullPolicy: IfNotPresent
  mcImage:
    repository: public.ecr.aws/aws-cli/aws-cli
    tag: latest
    pullPolicy: IfNotPresent
  servicePort: 9000
  consolePort: 9001
  storage:
    size: 2Gi
  bucketName: mlflow

mlflow:
  enabled: true
  image:
    repository: ghcr.io/raptorex65/aidp-mlflow
    tag: latest
    pullPolicy: Always
  replicas: 1
  servicePort: 5000
  containerPort: 5000

ingress:
  enabled: true
  className: nginx
  host: aidp.local
  paths:
    api: /api
    mlflow: /mlflow

secrets:
  postgres:
    username: mlflow
    password: mlflowpass
    database: mlflow
  minio:
    rootUser: minio
    rootPassword: minio12345
  mlflow:
    awsAccessKeyId: minio
    awsSecretAccessKey: minio12345

resources:
  modelApi: {}
  mlflow: {}
  postgres: {}
  minio: {}

labels:
  app: aidp
