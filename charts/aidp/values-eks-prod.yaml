namespace: aidp

global:
  environment: prod
  storageClass: gp3
  imageTag: latest

modelApi:
  replicas: 2

mlflow:
  replicas: 1
  s3EndpointUrl: "http://minio:9000"
  backendStoreUri: "postgresql+psycopg2://aidpuser:powerkube19@postgres:5432/aidpdb"
  artifactRoot: "s3://mlflow"

postgres:
  replicas: 1
  storage:
    size: 4Gi

minio:
  replicas: 1
  storage:
    size: 4Gi

ingress:
  enabled: false
  className: nginx
  host: aidp-eks-prod.local

resources:
  modelApi:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  mlflow:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

  postgres:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  minio:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi