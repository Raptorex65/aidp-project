name: CI - Build and Push Model API

on:
  push:
    branches:
      - main
    paths:
      - "apps/model-api/**"
      - ".github/workflows/ci.yaml"
      - "charts/aidp/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/model-api/**"
      - ".github/workflows/ci.yaml"
      - "charts/aidp/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: raptorex65/aidp-model-api
  REGISTRY: ghcr.io
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/model-api/requirements.txt ]; then
            pip install -r apps/model-api/requirements.txt
          fi

      - name: Validate Python syntax
        run: |
          python -m py_compile apps/model-api/main.py          

      - name: Extract image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $SHORT_SHA"
                    
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -f apps/model-api/Dockerfile .

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
  trigger-azure-devops:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Azure DevOps deployment pipeline
        env:
          AZDO_ORG: ${{ secrets.AZDO_ORG }}
          AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
          AZDO_PIPELINE_ID: ${{ secrets.AZDO_PIPELINE_ID }}
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        shell: bash
        run: |
          echo "Triggering Azure DevOps pipeline with image tag: $IMAGE_TAG"

          AUTH=$(printf ':%s' "$AZDO_PAT" | base64 | tr -d '\n')

          RESPONSE=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic $AUTH" \
            "https://dev.azure.com/${AZDO_ORG}/${AZDO_PROJECT}/_apis/pipelines/${AZDO_PIPELINE_ID}/runs?api-version=7.1" \
            -d "{
              \"templateParameters\": {
                \"imageTag\": \"${IMAGE_TAG}\"
              }
            }")

          echo "$RESPONSE"