name: CI - Build and Push Model API

on:
  push:
    branches:
      - main
    paths:
      - "apps/model-api/**"
      - "apps/mlflow/**"
      - "apps/trainer/**"
      - ".github/workflows/ci.yaml"
      - "charts/aidp/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/model-api/**"
      - "apps/mlflow/**"
      - "apps/trainer/**"
      - ".github/workflows/ci.yaml"
      - "charts/aidp/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_OWNER: raptorex65
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: model-api
            image: aidp-model-api
            dockerfile: apps/model-api/Dockerfile

          - component: mlflow
            image: aidp-mlflow
            dockerfile: apps/mlflow/Dockerfile

          - component: trainer
            image: aidp-trainer
            dockerfile: apps/trainer/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub environment
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Runner OS: $RUNNER_OS"
          echo "Python version:"
          python --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/model-api/requirements.txt ]; then
            pip install -r apps/model-api/requirements.txt
          fi

      - name: Validate Python syntax
        run: |
          python -m py_compile apps/model-api/main.py          

      - name: Extract image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $SHORT_SHA"
                    
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'      
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ steps.meta.outputs.short_sha}} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:latest \
            -f ${{ matrix.dockerfile }} .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
              docker push ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ steps.meta.outputs.short_sha }}
              docker push ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:latest

