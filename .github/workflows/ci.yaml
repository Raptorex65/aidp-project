name: CI - Build and Push Model API

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/model-api/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/model-api/**'
      - '.github/workflows/ci.yaml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/raptorex65/aidp-model-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/model-api/requirements.txt ]; then
            pip install -r apps/model-api/requirements.txt
          fi

      - name: Run basic Python syntax check
        run: |
          python -m py_compile apps/model-api/main.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }} \
            -t ${{ steps.meta.outputs.image }}:latest \
            -f apps/model-api/Dockerfile .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          docker push ${{ steps.meta.outputs.image }}:latest