name: CD - Deploy to Dev on Self-Hosted Runner

on:
  workflow_run:
    workflows: ["CI - Build and Push Model API"]
    types:
      - completed

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/raptorex65/aidp-model-api
  RELEASE_NAME: aidp-local
  NAMESPACE: aidp-helm
  MINIKUBE_EXE: 'C:\Program Files\Kubernetes\Minikube\minikube.exe'

jobs:
  deploy-dev:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: [self-hosted, Windows, X64]
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check Minikube path and cluster
        shell: powershell
        run: |
          if (-not (Test-Path $env:MINIKUBE_EXE)) {
            throw "Minikube executable not found"
          }
          & $env:MINIKUBE_EXE status
          if ($LASTEXITCODE -ne 0) {
            throw "Minikube is not ready"
          }

      - name: Verify local tools
        shell: powershell
        run: |
          kubectl version --client
          helm version
          & "${{ env.MINIKUBE_EXE }}" version
          docker version

      - name: Set image tag from CI commit SHA
        id: vars
        shell: powershell
        run: |
          $shortSha = "${{ github.event.workflow_run.head_sha }}".Substring(0,7)
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            "short_sha=$shortSha`n",
            $utf8
          )
            
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image from GHCR
        shell: powershell
        run: |
          docker pull "${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}"

      - name: Load image into Minikube
        shell: powershell
        run: |
          & "${{ env.MINIKUBE_EXE }}" image load "${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}"

      - name: Helm upgrade/install
        shell: powershell
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ./charts/aidp `
            --namespace ${{ env.NAMESPACE }} `
            --create-namespace `
            --set modelApi.image.repository=${{ env.IMAGE_NAME }} `
            --set-string modelApi.image.tag=${{ steps.vars.outputs.short_sha }} `
            --set modelApi.image.pullPolicy=IfNotPresent `
            --set ingress.host=aidp-helm.local

      - name: Wait for rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/postgres -n ${{ env.NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/minio -n ${{ env.NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/mlflow -n ${{ env.NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/model-api -n ${{ env.NAMESPACE }} --timeout=180s

      - name: Show resulting pods
        shell: powershell
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}