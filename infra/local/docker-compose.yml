version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: aidp-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflowpass
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-06-11T03-13-30Z
    container_name: aidp-minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # One-time bucket creation helper
  mc:
    image: minio/mc:latest
    container_name: aidp-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minio minio12345) do echo '...waiting for minio' && sleep 2; done;
      /usr/bin/mc mb -p local/mlflow || true;
      /usr/bin/mc anonymous set download local/mlflow || true;
      echo 'MinIO bucket ready.';
      "

  mlflow:
    build:
      context: ../../
      dockerfile: apps/mlflow/Dockerfile
    container_name: aidp-mlflow
    depends_on:
      - postgres
      - minio
      - mc
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://mlflow:mlflowpass@postgres:5432/mlflow
      --default-artifact-root s3://mlflow/
    ports:
      - "5000:5000"

  model-api:
    build:
      context: ../../
      dockerfile: apps/model-api/Dockerfile
    container_name: aidp-model-api
    depends_on:
      - mlflow
      - minio
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: iris-classifier
      # Needed so this container can download artifacts from MinIO
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata: