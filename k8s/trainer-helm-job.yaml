apiVersion: batch/v1
kind: Job
metadata:
  name: aidp-trainer
  namespace: aidp-helm
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: ghcr.io/raptorex65/aidp-trainer:f64dede
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"

            - name: MODEL_NAME
              value: "iris-classifier"

            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio:9000"

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD