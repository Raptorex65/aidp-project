apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-config
  namespace: aidp
data:
  MLFLOW_TRACKING_URI: http://0.0.0.0:5000
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow/
  MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:mlflowpass@postgres:5432/mlflow
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-s3-secret
  namespace: aidp
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio12345
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: aidp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.14.1
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: mlflow-config
            - secretRef:
                name: mlflow-s3-secret
          command: ["/bin/sh", "-c"]
          args:
            - |
              # MLflow needs a Postgres driver. Install it at container start (OK for Minikube dev).
              pip install --no-cache-dir psycopg2-binary==2.9.9 && \
              mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --backend-store-uri "${MLFLOW_BACKEND_STORE_URI}" \
                --default-artifact-root "${MLFLOW_DEFAULT_ARTIFACT_ROOT}"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: aidp
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP